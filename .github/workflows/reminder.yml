name: Daily reminder
on:
  schedule:
    - cron: "0 20 * * *"   # 21:00 UK during British Summer Time
    - cron: "0 21 * * *"   # 21:00 UK during GMT
  workflow_dispatch:        # "Run workflow" button for testing
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Only fire when it is 21:00 in the UK
        id: gate
        run: |
          H=$(TZ=Europe/London date +%H)
          echo "UK hour is $H"
          if [ "$H" = "21" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=yes" >> "$GITHUB_OUTPUT"; else echo "go=no" >> "$GITHUB_OUTPUT"; echo "Not 21:00 UK — nothing to do."; fi
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.go == 'yes'
        with: { node-version: 22 }
      - name: Send the push
        if: steps.gate.outputs.go == 'yes'
        env:
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          PUSH_SUBSCRIPTION: ${{ secrets.PUSH_SUBSCRIPTION }}
          VAPID_PUBLIC: "BCNG7-oLI5UbnftAzO0-XoxsvVWkQzzJgr5kbCG4PDL2MIn_1L-UKnp4pNUCYe_EwMGTBz-sroLMFJ-d3LZ0kDQ"
        run: |
          npm i --silent web-push@3
          node -e '
            const wp=require("web-push");
            const priv=(process.env.VAPID_PRIVATE||"").trim(), subRaw=(process.env.PUSH_SUBSCRIPTION||"").trim();
            if(!priv){console.error("::error::The VAPID_PRIVATE secret is missing or empty. Add it under Settings → Secrets and variables → Actions.");process.exit(1);}
            if(!/^[A-Za-z0-9_-]{40,50}$/.test(priv)){console.error("::error::VAPID_PRIVATE does not look like the key from VAPID_PRIVATE.txt (expected one line of 43 letters/digits/-/_ ; got "+priv.length+" characters).");process.exit(1);}
            if(!subRaw){console.log("PUSH_SUBSCRIPTION secret not set yet — enable the reminder in the app, then paste the subscription as a secret. Nothing sent.");process.exit(0);}
            let sub;try{sub=JSON.parse(subRaw);}catch(e){console.error("::error::PUSH_SUBSCRIPTION is not valid JSON — copy it again from the app (Settings → Daily reminder → Copy subscription) and paste the whole thing, starting with { and ending with }.");process.exit(1);}
            if(!sub.endpoint||!sub.keys||!sub.keys.p256dh||!sub.keys.auth){console.error("::error::PUSH_SUBSCRIPTION is missing endpoint or keys — copy it again from the app.");process.exit(1);}
            wp.setVapidDetails("mailto:reminder@example.com",process.env.VAPID_PUBLIC,priv);
            const body=JSON.stringify({title:"Intake Ledger",body:"What did you eat today? Tap to log it — food and exercise."});
            wp.sendNotification(sub,body,{TTL:6*3600,urgency:"high"})
              .then(r=>console.log("Sent — push service replied "+r.statusCode))
              .catch(e=>{console.error("::error::Push failed with status "+e.statusCode+": "+(e.body||e.message));
                if(e.statusCode===410||e.statusCode===404)console.error("::error::The phone subscription has expired. In the app: Settings → Daily reminder → Turn off, then Enable again, copy, and update the PUSH_SUBSCRIPTION secret.");
                if(e.statusCode===401||e.statusCode===403)console.error("::error::The push service rejected the signature — VAPID_PRIVATE does not match the key built into the app.");
                process.exit(1);});
          '
